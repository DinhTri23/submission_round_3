# Railway configuration.
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Run once per day at 06:00 UTC. Adjust to your timezone/needs.
# Railway Cron runs the container's CMD to completion, then stops it --
# this matches our "docker run should execute one sync job and exit" requirement.
cronSchedule = "0 6 * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 2