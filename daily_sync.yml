name: Daily OptiBot Sync

on:
  schedule:
    # Runs daily at 06:00 UTC. Adjust as needed.
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # allows manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # IMPORTANT trade-off vs. Railway:
      # GitHub Actions runners are fully ephemeral -- there is no persistent
      # volume between runs. To keep sync_state.json across days, we cache
      # it here using actions/cache, keyed so today's run restores yesterday's
      # state and a post-job step (implicit via cache save) persists it again.
      # This is workable for a take-home, but Railway + a real Volume is the
      # more robust production pattern since cache eviction/collisions are
      # possible on GitHub's side.
      - name: Restore sync state cache
        uses: actions/cache@v4
        with:
          path: config/
          key: optibot-sync-state-${{ github.run_id }}
          restore-keys: |
            optibot-sync-state-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t optibot .

      - name: Run daily sync
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p config data
          docker run --rm \
            -e OPENAI_API_KEY \
            -v ${{ github.workspace }}/config:/app/config \
            -v ${{ github.workspace }}/data:/app/data \
            optibot